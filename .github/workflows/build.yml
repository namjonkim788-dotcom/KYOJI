name: Build KYOJI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace > build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_OUTPUT"
          cat build.log

      - name: Upload complete log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KYOJI-error-report
          path: build.log

      - name: Fail if build failed
        if: steps.build.outputs.BUILD_EXIT != '0'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KYOJI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
